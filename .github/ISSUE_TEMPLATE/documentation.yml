name: Documentation
description: Documentation that is wrong, missing or unclear
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: A link, or a file and section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
