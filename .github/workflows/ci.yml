name: CI

# Checks for every pull request into dev and main, and for every push to dev.
# A draft pull request runs only the quick checks; the rest run once it is
# marked ready for review. Nothing here needs a secret - the test node is a
# public image and makes its own funded keys - so pull requests from forks run
# the same checks.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Check the commits in this pull request
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  check:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: npx eslint .
      - run: yarn test
      - name: Check the build output
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: node scripts/check-dist.mjs

  integration:
    name: Integration tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn node:start
      - run: yarn test:integration
      - name: Show the node's log
        if: failure()
        run: docker logs --tail 200 beatoz-sdk-testnode
      - name: Stop the node
        if: always()
        run: yarn node:stop
